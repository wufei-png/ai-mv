<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="assets/runtime/font/index.css">
  <link rel="stylesheet" href="style.css">
  <title>Xiang Yu — HyperFrames study</title>
</head>
<body>
  <div id="main" data-composition-id="main" data-start="0" data-duration="20.9"
    data-width="1920" data-height="1080" data-fps="30">
    <div id="stage">
      <div id="world" data-layout-allow-overflow>
        <img id="camp" src="assets/runtime/camp-v001.png" alt="">
        <img id="river" src="assets/runtime/river-v001.png" alt="">
        <div class="side-shade"></div>
        <div id="warrior" class="actor">
          <div id="warrior-side" class="pose"></div>
          <div id="warrior-bow" class="pose"></div>
          <div id="warrior-back" class="pose"></div>
        </div>
        <div id="woman" class="actor">
          <div id="woman-side" class="pose"></div>
          <div id="woman-bow" class="pose"></div>
        </div>
      </div>
      <img id="closeup" src="assets/runtime/farewell-v001.png" alt="">
      <div id="embers" aria-hidden="true"></div>
      <div id="title">项 虞 <span>· 夜别</span></div>
      <div id="caption-area" aria-live="off"></div>
      <div class="letterbox top"></div>
      <div class="letterbox bottom"></div>
      <div id="ending"></div>
    </div>
    <audio id="song" class="clip" data-start="0" data-duration="20.9" data-track-index="1"
      data-volume="1" src="assets/runtime/excerpt.wav"></audio>
  </div>
  <script src="assets/runtime/gsap.min.js"></script>
  <script src="assets/runtime/cues.js"></script>
  <script src="scene.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = window.createXiangYuTimeline();
  </script>
</body>
</html>
